[package]
name = "agent"
version = "0.1.0"
edition = "2021"
description = "Frida agent for ARM64 Android"

[features]
default = ["quickjs"]
frida-gum = ["dep:frida-gum"]
qbdi = ["quickjs-hook?/qbdi"]
quickjs = ["dep:quickjs-hook"]
# 测试专用故障注入（HIDE_FAULT_INJECTION + rust_set_hide_fault_stage 导出）。
# 与 rust_frida 的同名 feature 联动；发布构建不得启用。
# 为什么门控：发布产物若携带故障注入入口，外部可令隐藏事务部分写入后回滚。
fault-injection = []

[dependencies]
frida-gum = { path = "../frida-gum", features = [
    "event-sink",
    "invocation-listener",
    "std"
], optional = true }
quickjs-hook = { path = "../quickjs-hook", optional = true }
libc = "1.0.0-alpha.1"
jni = "0.21.1"
once_cell = "1.21.3"
lazy_static = "1.5.0"
crossbeam-channel = "0.5"
prost = "0.13"
nix = { version = "0.30.1", features = ["ptrace", "socket", "uio"] }

[build-dependencies]
cc = "1.2.29"
anyhow = { workspace = true }

[lib]
name = "agent"
crate-type = ["cdylib"]
path = "src/lib.rs"
